[package]
name = "liaise"
version = "0.2.4"
edition = "2024"
rust-version = "1.85"

license = "MIT OR Apache-2.0"
description = "Diagnostic code, report, token, evidence, and digest contracts."
authors = ["James Hunt <james@1o.business>"]
repository = "https://github.com/jameshuntt/liaise"
readme = "readme.md"

[features]
default = ["std"]
std = ["liaise_derive/std", "stable_digest/std"]
syn-error = ["dep:syn", "dep:proc-macro2", "dep:quote"]
# The upstream event's wire form (event::LiaiseEvent, LiaiseSeverity), without std.
serde = ["dep:serde"]

[dev-dependencies]
serde_json = "1"

[dependencies]
stable_digest = { path = "../stable_digest", version = "0.1.1", default-features = false }
syn = { version = "2.0.114", optional = true }
proc-macro2 = { version = "1.0.106", optional = true }
quote = { version = "1.0.44", optional = true }
liaise_derive = { path = "../liaise_derive", version = "0.3.4", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"], optional = true }
